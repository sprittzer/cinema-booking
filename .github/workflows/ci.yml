name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v4

      - name: Установить зависимости
        run: uv sync

      - name: Ruff — проверка стиля
        run: uv run ruff check src/ tests/

      - name: Ruff — проверка форматирования
        run: uv run ruff format --check src/ tests/

  type-check:
    name: Типизация
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v4

      - name: Установить зависимости
        run: uv sync

      - name: Mypy
        run: uv run mypy src/
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test_db
          SECRET_KEY: test-secret-key
          TMDB_API_KEY: test-key
          RESEND_API_KEY: test-key

  test:
    name: Тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v4

      - name: Установить зависимости
        run: uv sync --group dev

      - name: Pytest с coverage
        run: uv run pytest tests/ -q --cov=src --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test_db
          SECRET_KEY: test-secret-key
          TMDB_API_KEY: test-key
          RESEND_API_KEY: test-key

  docker:
    name: Сборка и публикация образа
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить образ
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cinema-booking-backend:latest
